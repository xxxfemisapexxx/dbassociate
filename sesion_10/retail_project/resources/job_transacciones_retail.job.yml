resources:
  jobs:
    daily_transacciones_detail:
      name: daily_transacciones_detail
      tasks:
        - task_key: bronze_load
          notebook_task:
            notebook_path: sesion_09/s9_bronze
            source: GIT
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_load
          notebook_task:
            notebook_path: sesion_09/s9_silver
            source: GIT
        - task_key: gold_aggreedated
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: sesion_09/s9_gold
            source: GIT
        - task_key: yelp_project
          depends_on:
            - task_key: gold_aggreedated
          pipeline_task:
            pipeline_id: ${resources.pipelines.yelp_pipeline_project.id}
      git_source:
        git_url: https://github.com/xxxfemisapexxx/dbassociate.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
