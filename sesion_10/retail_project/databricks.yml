# This is a Databricks asset bundle definition for retail_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: retail_project
  uuid: 6bd8c4ab-7f8d-459b-be2e-780e17983f2e

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-07f08cd8-9b0c.cloud.databricks.com
    variables:
      catalog: dbassociate
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-07f08cd8-9b0c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/fernando.miguel.salazar.p@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/fernando.miguel.salazar.p@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbassociate
      schema: prod
    permissions:
      - user_name: fernando.miguel.salazar.p@gmail.com
        level: CAN_MANAGE
